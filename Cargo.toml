# SPDX-License-Identifier: Apache-2.0 OR MIT
[workspace]
resolver = "2"
members = [
    "crates/kiln-core",
    "crates/kiln-cache",
    "crates/kiln-exec",
    "crates/kiln",
    "crates/kiln-cli",
    "crates/kiln-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV 1.81 because the ms-rust restriction lints
# (allow_attributes_without_reason, etc.) require the `reason = "..."`
# attribute field, stabilized in 1.81 alongside #[expect].
rust-version = "1.81"
license = "Apache-2.0 OR MIT"
authors = ["Antonette Caldwell"]
repository = "https://github.com/nebucloud/kiln"
homepage = "https://github.com/nebucloud/kiln"
readme = "README.md"
keywords = ["hermetic", "sandbox", "build", "cache", "execution"]
categories = ["development-tools::build-utils"]

[workspace.dependencies]
# Internal crates — referenced from sibling members via `workspace = true`.
kiln-core = { path = "crates/kiln-core", version = "0.1.0" }
kiln-cache = { path = "crates/kiln-cache", version = "0.1.0" }
kiln-exec = { path = "crates/kiln-exec", version = "0.1.0" }

# External crates.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
petgraph = "0.6"
thiserror = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
tonic = "0.11"
prost = "0.12"

# M-STATIC-VERIFICATION (ms-rust 08_universal_guidelines.md). Workspace-wide
# lint policy — every crate inherits via `[lints] workspace = true`.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Major clippy categories.
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, more false positives

# Restriction-group lints — opt-in for consistency, quality, brevity.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
implicit_clone = "warn"  # replaces removed `clippy::string_to_string`
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Conflicts with structured-logging message templates (M-LOG-STRUCTURED).
literal_string_with_formatting_args = "allow"
